name: Testes de software

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências para os testes sem hardware
        run: python -m pip install flask pyserial opencv-python
      - name: Verificar sintaxe Python
        run: python -m compileall -q .
      - name: Executar testes
        run: python -m unittest discover -s tests -v
